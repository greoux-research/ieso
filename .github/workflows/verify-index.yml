# Install a published IES Optimiser release from a package index and verify it, on every
# supported platform, outside any checkout (tools/verify_index_install.py).
# Called by release.yml after each upload; it needs the run's 'test-bundle'
# and 'release-dist' artifacts (SHA256SUMS of the artifacts that were tested).

name: verify-index

on:
  workflow_call:
    inputs:
      index:
        description: testpypi or pypi
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-24.04
    container: python:${{ matrix.python }}-slim
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: test-bundle
          path: bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: release-dist
      - name: Install from ${{ inputs.index }} and verify
        run: >
          python bundle/tools/verify_index_install.py --index "${{ inputs.index }}" --version "${{ inputs.version }}"
          --sha256sums release-dist/SHA256SUMS --bundle bundle --report report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: verify-${{ inputs.index }}-linux-x86_64-py${{ matrix.python }}
          path: report/

  native:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-x86_64, macos-arm64, windows-amd64]
        python: ["3.11", "3.14"]
        include:
          - {platform: macos-x86_64, os: macos-15-intel}
          - {platform: macos-arm64, os: macos-15}
          - {platform: windows-amd64, os: windows-2022}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: test-bundle
          path: bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: release-dist
      - name: Install from ${{ inputs.index }} and verify
        shell: bash
        run: >
          python bundle/tools/verify_index_install.py --index "${{ inputs.index }}" --version "${{ inputs.version }}"
          --sha256sums release-dist/SHA256SUMS --bundle bundle --report report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: verify-${{ inputs.index }}-${{ matrix.platform }}-py${{ matrix.python }}
          path: report/
