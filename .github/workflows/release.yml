# Release IES Optimiser: build, test, publish and verify one tagged commit.
#
# Triggered only by pushing a version tag (v2026.9.0, v2026.9.0rc1) -- never by
# a pull request. One run:
#
#   check      the tag names the version in pyproject.toml, the commit is on
#              main, and the version is new on PyPI and TestPyPI
#   build      the whole of wheels.yml (every platform built and tested)
#   collect    gathers exactly those artifacts, validates metadata and
#              contents, records SHA256SUMS
#   testpypi   uploads them to TestPyPI (Trusted Publishing, environment 'testpypi')
#   verify     installs from TestPyPI on every platform and tests it
#   pypi       final versions only, after approval in the 'pypi' environment:
#              uploads the same files to PyPI (Trusted Publishing)
#   verify     installs from PyPI, including an unversioned 'pip install ies-optimiser'
#
# Nothing is rebuilt after 'build': the publishing jobs upload the files that
# were tested, checked against SHA256SUMS. Only the two publishing jobs hold
# id-token: write. No API token is used. See docs/releasing.md.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - id: check
        run: python tools/release_check.py --tag "$GITHUB_REF_NAME" --require-on-main --github-output "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/wheels.yml

  collect:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Validate the release files
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python -m pip install twine
          ls -l dist
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          test "$(ls dist/*.whl | wc -l)" -eq 4
          for tag in manylinux_2_28_x86_64 macosx_11_0_arm64 macosx_10_15_x86_64 win_amd64; do
            ls dist/ies_optimiser-"$VERSION"-py3-none-*"$tag"*.whl
          done
          test -f "dist/ies_optimiser-$VERSION.tar.gz"
          python -m twine check --strict dist/*
          python tools/check_dist.py dist/*
          mkdir release-dist
          cp dist/* release-dist/
          (cd release-dist && sha256sum ies_optimiser-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: release-dist/
          if-no-files-found: error

  testpypi:
    needs: [check, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ies-optimiser/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: release-dist
      - name: The files to upload are the files that were tested
        run: |
          cd release-dist && sha256sum --check --strict SHA256SUMS
          mkdir ../upload && mv ies_optimiser-* ../upload/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/

  verify-testpypi:
    needs: [check, testpypi]
    uses: ./.github/workflows/verify-index.yml
    with:
      index: testpypi
      version: ${{ needs.check.outputs.version }}

  pypi:
    # Final versions only; prereleases stop after TestPyPI. Approval is required
    # by the 'pypi' environment's protection rules (docs/releasing.md).
    needs: [check, verify-testpypi]
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/ies-optimiser/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: release-dist
      - name: The files to upload are the files that were tested
        run: |
          cd release-dist && sha256sum --check --strict SHA256SUMS
          mkdir ../upload && mv ies_optimiser-* ../upload/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: upload/

  verify-pypi:
    needs: [check, pypi]
    uses: ./.github/workflows/verify-index.yml
    with:
      index: pypi
      version: ${{ needs.check.outputs.version }}
